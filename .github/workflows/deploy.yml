name: Deploy

# Deploys whatever the repository's default branch currently is, so this keeps
# working if the branch is later renamed or merged into main.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # Turning Pages on is a repository setting, and the workflow token is not
      # allowed to do it. Say so plainly rather than failing on an opaque 404.
      - name: Check that Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = "404" ]; then
            echo "::error title=Enable GitHub Pages::One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions. Then re-run this workflow and every later push deploys automatically."
            exit 1
          fi
          echo "Pages is enabled (HTTP $status)."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
