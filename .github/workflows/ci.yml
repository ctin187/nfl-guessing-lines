name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Schedule importer still yields a valid season
        run: node scripts/import-schedule.mjs --out /tmp/schedule-check.json

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e
